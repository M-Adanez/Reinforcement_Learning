[project]
name = "reinforcement-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.3.0",
    "icecream>=2.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "optuna>=5.0.0",
    "pygame>=2.6.1",
    "tensorboard>=2.21.0",
    "torch>=2.14.1",
]

[project.scripts]
reinforcement-learning = "reinforcement_learning:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"


[tool.pyright]
venvPath = "."
venv = ".venv"

